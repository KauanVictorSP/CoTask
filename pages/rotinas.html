<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CoTask - Minhas Rotinas</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/rotinas.css">

    <script src="../js/api.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js" defer></script>
    <script src="../js/rotinas.js" defer></script>
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topo">

        <div class="logo">
            <img src="../assets/imagens/logo-cotask.png" alt="Logo CoTask">
            <span>CoTask</span>
        </div>

        <div class="usuario">
            <span id="nome-usuario">Olá!</span>
            <button id="botao-sair" type="button">Sair</button>
        </div>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">

            <h2>Menu</h2>

            <nav>
                <a href="#" class="menu-ativo">Minhas rotinas</a>
                <a href="#">Calendário</a>
                <a href="#">Todas as atividades</a>
            </nav>

            <button id="botao-nova-atividade" type="button">
                + Nova atividade
            </button>

        </aside>

        <!-- ÁREA PRINCIPAL -->
        <section class="area-rotinas">

            <div class="titulo-pagina">
                <div>
                    <h1>Minhas rotinas</h1>
                    <p>Organize suas tarefas e acompanhe seu progresso.</p>
                </div>
            </div>

            <!-- CALENDÁRIO -->
            <section class="calendario">

                <div class="navegacao-calendario">
                    <button id="mes-anterior" type="button">&lt;</button>

                    <h2 id="mes-atual"></h2>

                    <button id="proximo-mes" type="button">&gt;</button>
                </div>

                <div class="dias-semana">
                    <span>Dom</span>
                    <span>Seg</span>
                    <span>Ter</span>
                    <span>Qua</span>
                    <span>Qui</span>
                    <span>Sex</span>
                    <span>Sáb</span>
                </div>

                <div id="dias-calendario"></div>

                <div class="legenda-calendario">

                    <div class="legenda-item">
                        <span class="legenda-cor dia-normal"></span>
                        <span>Dia normal</span>
                    </div>

                    <div class="legenda-item">
                        <span class="legenda-cor dia-selecionado"></span>
                        <span>Dia selecionado</span>
                    </div>

                    <div class="legenda-item">
                        <span class="legenda-cor dia-feriado"></span>
                        <span>Feriado</span>
                    </div>

                </div>

            </section>

            <!-- ATIVIDADES -->
            <section class="atividades">

                <div class="cabecalho-atividades">

                    <div class="informacoes-data">

                        <h2>
                            Atividades de <span id="data-selecionada"></span>
                        </h2>

                        <div id="informacao-feriado"></div>

                    </div>

                    <button id="botao-adicionar-atividade" type="button">
                        + Adicionar atividade
                    </button>

                </div>

                <div id="lista-atividades">

                    <p class="mensagem-vazia">
                        Selecione um dia no calendário para visualizar suas atividades.
                    </p>

                </div>

            </section>

        </section>

    </main>

    <!-- MODAL DE NOVA ATIVIDADE -->
    <div id="modal-atividade" class="modal-atividade" hidden>

        <div class="conteudo-modal">

            <button type="button" id="fechar-modal" class="fechar-modal">
                &times;
            </button>

            <form id="form-atividade" class="form-atividade">

                <h3>Nova atividade</h3>

                <!-- TÍTULO -->
                <label for="titulo-atividade">Título</label>

                <input
                    type="text"
                    id="titulo-atividade"
                    placeholder="Ex: Estudar JavaScript"
                    required
                >

                <!-- DESCRIÇÃO -->
                <label for="descricao-atividade">Descrição</label>

                <textarea
                    id="descricao-atividade"
                    placeholder="Descreva sua atividade..."
                    rows="3"
                ></textarea>

                <!-- DATA -->
                <label for="data-atividade">Data da atividade</label>

                <input
                    type="date"
                    id="data-atividade"
                    required
                >

                <!-- SELEÇÃO DE HORÁRIO -->
                <label>Horário</label>

                <input
                    type="hidden"
                    id="horario-atividade"
                    value=""
                >

                <div
                    id="horas-disponiveis"
                    class="grade-horarios"
                ></div>

                <!-- SELEÇÃO DOS MINUTOS -->
                <div id="selecao-minutos" hidden>

                    <label>Hora selecionada</label>

                    <div class="campo-hora-selecionada">

                        <input
                            type="text"
                            id="hora-selecionada"
                            readonly
                        >

                        <button type="button" id="alterar-hora">
                            Alterar hora
                        </button>

                    </div>

                    <label>Selecione os minutos</label>

                    <div
                        id="minutos-disponiveis"
                        class="grade-horarios"
                    ></div>

                </div>

                <!-- HORÁRIO FINAL -->
                <div id="horario-final" hidden>

                    <div class="campo-hora-selecionada">

                        <input
                            type="text"
                            id="horario-exibido"
                            readonly
                        >

                        <button type="button" id="alterar-horario">
                            Alterar horário
                        </button>

                    </div>

                </div>

                <!-- PARTICIPANTE -->
                <label for="participante-atividade">
                    Nome do participante
                </label>

                <input
                    type="text"
                    id="participante-atividade"
                    placeholder="Nome de quem participará"
                >

                <!-- E-MAIL -->
                <label for="email-participante">
                    E-mail do participante
                </label>

                <input
                    type="email"
                    id="email-participante"
                    placeholder="email@exemplo.com"
                >

                <!-- BOTÃO DE CADASTRO -->
                <button type="submit" id="botao-salvar-atividade">
                    Salvar atividade
                </button>

            </form>

        </div>

    </div>

</body>

</html>
```
